name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Apply the cheat patch
        run: |
          git apply --check cubeevil4-sprint-keyitems.patch
      git apply cubeevil4-sprint-keyitems.patch
          git status --short

      - name: Install build tools and the Android NDK r28c
        run: sudo bash port/tools/whole_setup_linux.sh --android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK parts (the runner has the SDK already)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Build the game core (armeabi-v7a and arm64-v8a)
        run: bash port/tools/whole_build_android.sh --abi all --ndk /opt/android-ndk-r28c

      - name: Build the APK
        working-directory: port/android-decomp
        run: |
          chmod +x gradlew
          ./gradlew assembleCoreDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-cheats-apk
          path: port/android-decomp/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
