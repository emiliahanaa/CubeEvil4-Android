name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Apply patch
        run: git apply "cubeevil4-sprint-keyitems (2).patch"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-APK
          path: |
            **/*.apk
